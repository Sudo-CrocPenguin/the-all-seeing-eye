services:
  postgres:
    image: postgres:17-alpine
    container_name: the_all_seeing_eye_postgres
    environment:
      POSTGRES_DB: the_all_seeing_eye
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: audit
    ports:
      - "${POSTGRES_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit -d the_all_seeing_eye"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
